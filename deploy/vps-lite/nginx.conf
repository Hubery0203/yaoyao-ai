# Loaded inside nginx http {}; applies only to this virtual host.
limit_conn_zone $server_name zone=yaoyao_login:32k;
server {
    listen 127.0.0.1:1443 ssl;
    server_name yaoyao.164.92.84.160.nip.io;
    ssl_certificate /etc/ssl/yaoyao/fullchain.cer;
    ssl_certificate_key /etc/ssl/yaoyao/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/yaoyao-ai/current/apps/web;
    client_max_body_size 100k;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    location = / { try_files /index.html =404; }
    location = /app.js { try_files $uri =404; }
    location = /style.css { try_files $uri =404; }
    location = /api/v1/users { return 403; }
    location = /api/v1/auth/login {
        limit_conn yaoyao_login 1;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:4300;
        proxy_read_timeout 125s;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_read_timeout 125s;
        proxy_buffering off;
        include /etc/nginx/proxy_params;
    }
    location = /health/ready { proxy_pass http://127.0.0.1:4300; }
    location = /health/live { proxy_pass http://127.0.0.1:4300; }
    location / { return 404; }
}
