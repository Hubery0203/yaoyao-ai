name: ci

on:
  push:
    branches: [main]
  pull_request:

# CI order (Technical Proposal §13): lint + boundaries → unit → migration +
# integration → e2e + security → image build. Merge requires T001–T012 and
# architecture checks green.

jobs:
  lint-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run boundaries

  unit-contract:
    runs-on: ubuntu-latest
    needs: lint-boundaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run test:web
      - run: node --test tools/weixin-w1/probe.test.mjs
      - run: node --test tools/backup/backup.test.mjs tools/backup/offsite.test.mjs tools/backup/snapshot.test.mjs tools/backup/evidence.test.mjs
      - run: node scripts/evaluate-quality.mjs --mode mock --out quality-report.json
      - run: node scripts/evaluate-experience.mjs --mode mock --out experience-report.json
      - run: node scripts/evaluate-experience.mjs --mode mock --fixtures tests/fixtures/experience-009.json --max-calls 30 --out experience-009-report.json
      - run: node scripts/evaluate-experience.mjs --mode mock --fixtures tests/fixtures/experience-010.json --max-calls 24 --out experience-010-report.json
      - run: node scripts/evaluate-experience.mjs --mode mock --fixtures tests/fixtures/naturalness-v2.json --max-turns 8 --max-calls 16 --out naturalness-v2-report.json
      - run: node scripts/evaluate-experience.mjs --mode mock --fixtures tests/fixtures/memory-precision.json --max-turns 6 --max-calls 12 --out memory-precision-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: memory-precision-report
          path: memory-precision-report.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: naturalness-v2-report
          path: naturalness-v2-report.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: experience-010-quality-report
          path: experience-010-report.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: experience-009-quality-report
          path: experience-009-report.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: experience-quality-report
          path: experience-report.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: conversation-quality-report
          path: quality-report.json
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    needs: lint-boundaries
    # Phase 3: integration tests use Testcontainers directly (pinned
    # pgvector/pgvector:0.8.0-pg16 image, real migrations, real roles), so
    # the same code controls image version, lifecycle, and role setup.
    # The runner provides Docker; no postgres service container needed.
    services:
      redis:
        image: redis:7.4.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      YAOYAO_TESTCONTAINERS: "1"
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/integration

  e2e:
    runs-on: ubuntu-latest
    needs: [unit-contract, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e

  image:
    runs-on: ubuntu-latest
    needs: [unit-contract, integration, e2e]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/api.Dockerfile -t yaoyao-ai/api:ci .
      - run: docker build -f deploy/worker.Dockerfile -t yaoyao-ai/worker:ci .
      - run: docker build -f deploy/web.Dockerfile -t yaoyao-ai/web:ci .

  linux-release:
    runs-on: ubuntu-24.04
    needs: [unit-contract, integration, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm prune --omit=dev
      - run: node scripts/package-linux.mjs
      - run: sha256sum yaoyao-linux-x64.tar.gz > yaoyao-linux-x64.sha256
      # A small, independently checksummed code bundle permits verified overlays
      # when package-lock and the deployed Linux dependency/runtime base are unchanged.
      - run: tar -czf yaoyao-linux-code.tar.gz -C release package.json package-lock.json core apps db deploy tools RELEASE.json
      - run: sha256sum yaoyao-linux-code.tar.gz > yaoyao-linux-code.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: yaoyao-linux-code
          path: |
            yaoyao-linux-code.tar.gz
            yaoyao-linux-code.sha256
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: yaoyao-linux-x64
          path: |
            yaoyao-linux-x64.tar.gz
            yaoyao-linux-x64.sha256
          retention-days: 7
